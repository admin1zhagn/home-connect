spring:
  application:
    name: home-connect
  profiles:
    active: h2
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  sql:
    init:
      mode: always
      encoding: UTF-8

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

server:
  # 本地默认 8080；免费云平台（Fly/Render/Koyeb 等）通常通过 PORT 或 SERVER_PORT 环境变量注入端口，这里兼容两者
  port: ${PORT:8080}

app:
  security:
    # 生产环境务必修改为足够长且随机的密钥（HS256 需要 >= 256 bits）
    jwt-secret: "home-connect-v1-very-long-secret-key-please-change-in-production-1234567890"
    jwt-expiration: 86400000
    admin-username: admin
    admin-password: admin123
  # 演示数据播种开关：true=首次启动（或库为空）时写入一批示例客户/套餐/分析数据；改为 false 可关闭
  demo:
    seed: true
